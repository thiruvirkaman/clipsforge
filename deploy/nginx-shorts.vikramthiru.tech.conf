server {
    listen 80;
    listen [::]:80;

    server_name shorts.vikramthiru.tech;

    error_log /var/log/nginx/clipforge-shorts-error.log warn;
    access_log /var/log/nginx/clipforge-shorts-access.log;

    # Large/slow video uploads.
    client_max_body_size 10G;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        limit_req zone=clipforge_limit burst=40 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:39518;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
