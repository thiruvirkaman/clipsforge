# frontend/nginx.conf

# Docker's embedded DNS server. Using it explicitly (with a short TTL),
# combined with a variable in proxy_pass below, forces nginx to re-resolve
# "api" on each request instead of caching whatever IP it had at startup --
# otherwise, recreating the api container (a redeploy, a restart, a rolling
# update) leaves nginx stuck proxying to a dead IP until nginx itself
# restarts (502 "Connection refused" to a stale address).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # nginx defaults to 1MB max request body, which would silently
        # reject any real video upload before it reaches the backend.
        # Matches backend MAX_UPLOAD_SIZE_BYTES (project_service.py), sized
        # for up to a ~3 hour source video.
        client_max_body_size 10G;
        # Generous timeouts so a large/slow upload isn't cut off mid-transfer.
        client_body_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
