[tool.ruff]
line-length = 100
target-version = "py311"
# Auto-generated/scaffolding, not hand-maintained -- excluded from lint.
extend-exclude = ["alembic/versions", "alembic/env.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "RUF"]

# FastAPI's dependency-injection pattern (`db: Session = Depends(get_db)`) is
# idiomatic and intentional, not the mutable-default-argument bug B008 flags.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PL"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["alembic/"]
