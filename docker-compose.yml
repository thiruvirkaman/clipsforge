# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-clipforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations exactly once before api/worker start, so
  # they never race each other creating the schema on a fresh database
  # (both running `alembic upgrade head` concurrently on an empty DB can
  # collide creating the `alembic_version` table). api/worker still run
  # `alembic upgrade head` themselves too (via docker-entrypoint.sh) as a
  # defense-in-depth no-op for deployments that don't honor `depends_on`
  # completion ordering -- safe because by then there's nothing left to
  # migrate, so no concurrent schema-write can occur.
  migrate:
    build: ./backend
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      ASR_SERVICE_BASE_URL: ${ASR_SERVICE_BASE_URL:-https://api.openai.com}
      ASR_MODEL: ${ASR_MODEL:-whisper-1}
      ASR_SERVICE_API_KEY: ${ASR_SERVICE_API_KEY:-}
      LLM_SERVICE_API_KEY: ${LLM_SERVICE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Bind address/port are parametrized (not just the host port) so a
    # deployment behind an existing reverse proxy can bind loopback-only
    # (e.g. API_BIND=127.0.0.1 API_PORT=8010 in .env) instead of exposing
    # this directly on the public interface. Defaults match local dev.
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - media_data:/data/media

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      ASR_SERVICE_BASE_URL: ${ASR_SERVICE_BASE_URL:-https://api.openai.com}
      ASR_MODEL: ${ASR_MODEL:-whisper-1}
      ASR_SERVICE_API_KEY: ${ASR_SERVICE_API_KEY:-}
      LLM_SERVICE_API_KEY: ${LLM_SERVICE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/data/media

  frontend:
    build: ./frontend
    # See the `api` service comment above -- same bind/port parametrization.
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
